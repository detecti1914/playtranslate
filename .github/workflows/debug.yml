name: Build PlayTranslate APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择构建类型'
        required: true
        default: 'both'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'both'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK (${{ inputs.build_type || 'both' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码及递归子模块
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 Android 许可协议
        run: |
          yes | sdkmanager --licenses || true

      - name: 安装精确匹配的 NDK、CMake 与 Platform SDK
        run: |
          echo "==> 安装指定版本的 Android 平台组件..."
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: 配置 Gradle 缓存与执行环境
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 Debug APK
        if: ${{ inputs.build_type == 'debug' || inputs.build_type == 'both' || github.event_name != 'workflow_dispatch' }}
        run: |
          echo "==> 正在编译 Debug APK..."
          ./gradlew assembleDebug --stacktrace

      - name: 编译 Release APK
        if: ${{ inputs.build_type == 'release' || inputs.build_type == 'both' || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "==> 正在编译 Release APK..."
          ./gradlew assembleRelease --stacktrace

      - name: 整理并重命名构建产物
        run: |
          mkdir -p output-apks
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output-apks/PlayTranslate-debug.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk output-apks/PlayTranslate-release.apk
          fi
          echo "==> 已收集产物列表："
          ls -lh output-apks/

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PlayTranslate-APKs
          path: output-apks/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传 R8 混淆映射文件（如果生成）
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: R8-Mapping
          path: releases/mapping-*.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: 自动创建 GitHub Release (仅在推送 Tag 时)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output-apks/*.apk
            releases/mapping-*.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
